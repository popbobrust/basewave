<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wave Survival</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h1>Wave Survival</h1>
    <div class="stats">
      <span>Health: <span id="health">100</span></span>
      <span>Wave: <span id="wave">1</span></span>
      <span>Enemies Left: <span id="enemies-left">0</span></span>
    </div>
    <button id="start-btn">Start Game</button>
    <div id="message"></div>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script src="game.js"></script>
</body>
</html>
