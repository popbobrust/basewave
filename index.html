<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>basewave</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="ui">
    <div class="stats">
      <span>Health: <span id="health">100</span></span>
      <span>Time: <span id="time">0:00</span></span>
      <span>Enemies Left: <span id="enemies-left">0</span></span>
      <span>Coins: <span id="coins">0</span></span>
      <span>Level: <span id="player-level">1</span></span>
    </div>

    <div id="gear-info"></div>
    <div id="abilities-bar"></div>
    <div id="message"></div>
  </div>

  <div id="main-menu" class="menu fullscreen">
    <h1>basewave</h1>

    <button id="play-btn">Play</button>
    <button id="inventory-btn">Inventory</button>
    <button id="highscores-btn">High Scores</button>

    <div class="chests">
      <button class="chest-btn" data-type="basic">Basic Crate: 1500</button>
      <button class="chest-btn" data-type="advanced">Advanced Crate: 5000</button>
      <button class="chest-btn" data-type="elite">Elite Crate: 60000</button>
    </div>
  </div>

  <div id="pause-menu" class="menu hidden fullscreen">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="quit-btn">Quit to Menu</button>
  </div>

  <div id="levelup-menu" class="menu hidden fullscreen">
    <h2>Level Up!</h2>
    <p>Choose an ability:</p>
    <div id="levelup-options"></div>
  </div>

  <div id="death-menu" class="menu hidden fullscreen">
    <h2>You Died</h2>
    <p id="death-summary"></p>
    <button id="death-restart-btn">Play Again</button>
    <button id="death-menu-btn">Back to Main Menu</button>
  </div>

  <!-- Inventory Panel -->
  <div id="inventory-menu" class="menu hidden fullscreen">
    <h2>Inventory</h2>
    <div style="display:flex; gap:16px; max-width:800px;">
      <!-- Equipped -->
      <div style="flex:1; border-right:1px solid #555; padding-right:10px;">
        <h3>Equipped</h3>
        <div id="equipped-slots">
          <div data-slot="helmet">Helmet: <span class="slot-item">None</span></div>
          <div data-slot="chest">Chest: <span class="slot-item">None</span></div>
          <div data-slot="legs">Legs: <span class="slot-item">None</span></div>
          <div data-slot="boots">Boots: <span class="slot-item">None</span></div>
          <div data-slot="gloves">Gloves: <span class="slot-item">None</span></div>
          <div data-slot="weapon">Weapon: <span class="slot-item">None</span></div>
        </div>
      </div>

      <!-- Inventory List -->
      <div style="flex:2;">
        <h3>Items</h3>
        <div id="inventory-list" style="max-height:260px; overflow-y:auto; border:1px solid #555; padding:6px;"></div>
        <div id="inventory-actions" style="margin-top:10px;">
          <button id="inv-move-btn">Equip</button>
          <button id="inv-merge-btn">Merge</button>
          <button id="inv-close-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Crate Popup -->
  <div id="crate-popup" class="menu hidden fullscreen">
    <h2>Crate Opened!</h2>
    <p id="crate-item-text"></p>
    <button id="crate-ok-btn">OK</button>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script src="currency.js"></script>
  <script src="gear.js"></script>
  <script src="chests.js"></script>
  <script src="abilities.js"></script>
  <script src="menu.js"></script>
  <script src="inventory.js"></script>
  <script src="game.js"></script>
</body>
</html>
